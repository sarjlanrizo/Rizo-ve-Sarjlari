<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şarj Aleti Stok & Finans Takip</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
            font-size: 20px;
        }
        
        /* Finansal Özet Paneli */
        .finance-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
        }
        .summary-card.profit {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .summary-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .summary-value {
            font-size: 14px;
            font-weight: bold;
            color: #1e293b;
        }
        .summary-card.profit .summary-value {
            color: #16a34a;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-add {
            background-color: #3498db;
            color: white;
        }
        .btn-remove {
            background-color: #e74c3c;
            color: white;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row .input-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #7f8c8d;
        }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fafafa;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3498db;
            outline: none;
            background-color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .btn-group .btn {
            flex: 1;
            margin-bottom: 0;
        }
        .stock-section {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
        .stock-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stock-stats {
            font-size: 12px;
            font-weight: normal;
            color: #94a3b8;
            display: flex;
            gap: 8px;
        }
        .stat-badge {
            background-color: #f1f5f9;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            color: #475569;
        }
        .stock-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .stock-item:hover, .stock-item:active {
            background-color: #f1f5f9;
            border-color: #3498db;
        }
        .image-box {
            width: 60px;
            height: 60px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background-color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .image-box:hover {
            border-color: #3498db;
            background-color: #f8fafc;
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-box span {
            font-size: 9px;
            color: #94a3b8;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
            line-height: 1.1;
        }
        .stock-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stock-name {
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            word-break: break-all;
        }
        .stock-count {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }
        .count-val {
            font-weight: bold;
            color: #2ecc71;
        }
        .stock-price-info {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .price-badge {
            background: #e2e8f0;
            padding: 2px 5px;
            border-radius: 4px;
        }
        .quick-actions {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .btn-quick {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155;
            transition: all 0.1s;
        }
        .btn-quick:active {
            background-color: #e2e8f0;
            transform: scale(0.95);
        }
        .btn-quick.add {
            color: #3498db;
            border-color: #93c5fd;
        }
        .btn-quick.sub {
            color: #e74c3c;
            border-color: #fca5a5;
        }
        .btn-delete {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 14px;
        }
        .btn-delete:active {
            background-color: #fee2e2;
            color: #ef4444;
            border-color: #fca5a5;
        }
        .hint-text {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-top: -5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Şarj Aleti Stok & Finans Takip</h2>
    
    <!-- Toplam Geliş / Satış ve Kâr Konsolu -->
    <div class="finance-summary">
        <div class="summary-card">
            <span class="summary-label">Toplam Maliyet</span>
            <span class="summary-value" id="total-gelis">0 ₺</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Toplam Değer</span>
            <span class="summary-value" id="total-satis">0 ₺</span>
        </div>
        <div class="summary-card profit">
            <span class="summary-label">Beklenen Kâr</span>
            <span class="summary-value" id="total-kar">0 ₺</span>
        </div>
    </div>

    <p class="hint-text">İşlem yapmak veya bilgileri forma aktarmak için listedeki ürüne dokunabilirsiniz.</p>

    <!-- Ürün ve Adet Girişi -->
    <div class="input-row">
        <div class="input-group" style="flex: 2;">
            <label for="urun-adi">Ürün Adı / Model</label>
            <input type="text" id="urun-adi" placeholder="Ürün adını girin..." list="urun-onerileri" autocomplete="off">
            <datalist id="urun-onerileri"></datalist>
        </div>
        <div class="input-group" style="flex: 1;">
            <label for="urun-adet">İşlem Adedi</label>
            <input type="number" id="urun-adet" placeholder="Adet" min="1" value="1">
        </div>
    </div>

    <!-- Geliş ve Satış Fiyatı Konsolu -->
    <div class="input-row">
        <div class="input-group">
            <label for="urun-gelis">Birim Geliş (₺)</label>
            <input type="number" id="urun-gelis" placeholder="0.00" min="0" step="any">
        </div>
        <div class="input-group">
            <label for="urun-satis">Birim Satış (₺)</label>
            <input type="number" id="urun-satis" placeholder="0.00" min="0" step="any">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-add" onclick="stokGuncelle(true)">Stok Ekle / Güncelle</button>
        <button class="btn btn-remove" onclick="stokGuncelle(false)">Stok Sat / Çıkar</button>
    </div>

    <div class="stock-section">
        <div class="stock-title">
            <span>Eldeki Mevcut Stok</span>
            <div class="stock-stats">
                <span id="total-types" class="stat-badge">0 Çeşit</span>
                <span id="total-items" class="stat-badge">Toplam: 0 Adet</span>
            </div>
        </div>
        <div id="stok-listesi">Yükleniyor...</div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'sarj_stok_v4';

    window.onload = function() {
        stokListele();
    };

    function formuDoldur(urunAdi) {
        const stoklar = getStoklar();
        const urun = stoklar[urunAdi];
        if (urun) {
            document.getElementById('urun-adi').value = urunAdi;
            document.getElementById('urun-adet').value = 1;
            document.getElementById('urun-gelis').value = urun.gelisFiyati !== undefined ? urun.gelisFiyati : "";
            document.getElementById('urun-satis').value = urun.satisFiyati !== undefined ? urun.satisFiyati : "";
        }
    }

    function getStoklar() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
            return {};
        }
    }

    function setStoklar(stoklar) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stoklar));
    }

    function paraFormati(tutar) {
        return Number(tutar || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
    }

    function stokGuncelle(ekle, belirliUrun = null, belirliAdet = null) {
        const urun = belirliUrun ? belirliUrun.trim() : document.getElementById('urun-adi').value.trim();
        const adet = belirliAdet ? parseInt(belirliAdet) : parseInt(document.getElementById('urun-adet').value);
        
        const gelis = parseFloat(document.getElementById('urun-gelis').value) || 0;
        const satis = parseFloat(document.getElementById('urun-satis').value) || 0;

        if (!urun) {
            alert("Lütfen bir ürün adı girin!");
            return;
        }
        if (isNaN(adet) || adet <= 0) {
            alert("Lütfen geçerli bir adet girin!");
            return;
        }

        let stoklar = getStoklar();
        if (!stoklar[urun]) {
            stoklar[urun] = { adet: 0, gorsel: "", gelisFiyati: 0, satisFiyati: 0 };
        }

        // Eğer formdan fiyat girilmişse güncelle
        if (!belirliUrun) {
            if (document.getElementById('urun-gelis').value !== "") {
                stoklar[urun].gelisFiyati = gelis;
            }
            if (document.getElementById('urun-satis').value !== "") {
                stoklar[urun].satisFiyati = satis;
            }
        }

        let mevcutAdet = stoklar[urun].adet || 0;

        if (ekle) {
            stoklar[urun].adet = mevcutAdet + adet;
            if (!belirliUrun) alert(`${adet} adet '${urun}' eklendi / güncellendi.`);
        } else {
            if (mevcutAdet < adet) {
                alert(`Yetersiz stok! '${urun}' için elde sadece ${mevcutAdet} adet var.`);
                return;
            } else {
                stoklar[urun].adet = mevcutAdet - adet;
                if (!belirliUrun) alert(`${adet} adet '${urun}' satıldı / stoktan düşüldü.`);
            }
        }

        setStoklar(stoklar);
        
        if (!belirliUrun) {
            document.getElementById('urun-adi').value = "";
            document.getElementById('urun-adet').value = "1";
            document.getElementById('urun-gelis').value = "";
            document.getElementById('urun-satis').value = "";
        }
        
        stokListele();
    }

    function hizliGuncelle(e, urun, ekle) {
        e.stopPropagation(); 
        stokGuncelle(ekle, urun, 1);
    }

    function urunSil(e, urun) {
        e.stopPropagation();
        if (confirm(`'${urun}' ürününü listeden tamamen silmek istiyor musunuz?`)) {
            let stoklar = getStoklar();
            delete stoklar[urun];
            setStoklar(stoklar);
            stokListele();
        }
    }

    function triggerGorselSec(e, urunKey) {
        e.stopPropagation(); 

        const oldInput = document.getElementById(`temp-file-${urunKey}`);
        if (oldInput) oldInput.remove();

        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.id = `temp-file-${urunKey}`;
        input.style.display = 'none';

        input.onchange = event => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(fEvent) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const max_size = 250;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    let stoklar = getStoklar();
                    if (stoklar[urunKey]) {
                        stoklar[urunKey].gorsel = compressedBase64;
                        setStoklar(stoklar);
                        stokListele();
                    }
                };
                img.src = fEvent.target.result;
            };
            reader.readAsDataURL(file);
        };

        document.body.appendChild(input);
        input.click();
    }

    function stokListele() {
        const stoklar = getStoklar();
        const listeAlani = document.getElementById('stok-listesi');
        const oneriAlani = document.getElementById('urun-onerileri');
        
        listeAlani.innerHTML = "";
        oneriAlani.innerHTML = ""; 

        const urunler = Object.keys(stoklar);
        let toplamAdet = 0;
        let toplamGelisTutari = 0;
        let toplamSatisTutari = 0;

        urunler.forEach(urun => {
            const item = stoklar[urun];
            const adet = item.adet || 0;
            const gelis = parseFloat(item.gelisFiyati) || 0;
            const satis = parseFloat(item.satisFiyati) || 0;

            toplamAdet += adet;
            toplamGelisTutari += (adet * gelis);
            toplamSatisTutari += (adet * satis);
        });

        const toplamKar = toplamSatisTutari - toplamGelisTutari;

        // Finans Paneli ve Rozetleri Güncelle
        document.getElementById('total-types').innerText = urunler.length + " Çeşit";
        document.getElementById('total-items').innerText = "Toplam: " + toplamAdet + " Adet";
        
        document.getElementById('total-gelis').innerText = paraFormati(toplamGelisTutari);
        document.getElementById('total-satis').innerText = paraFormati(toplamSatisTutari);
        document.getElementById('total-kar').innerText = paraFormati(toplamKar);

        if (urunler.length === 0) {
            listeAlani.innerHTML = "<p style='color: #888; text-align: center; padding: 20px 0;'>Stokta hiç ürün bulunmuyor.</p>";
            return;
        }

        urunler.forEach(urun => {
            const urunVerisi = stoklar[urun];
            const adet = urunVerisi.adet || 0;
            const gelis = parseFloat(urunVerisi.gelisFiyati) || 0;
            const satis = parseFloat(urunVerisi.satisFiyati) || 0;
            
            const option = document.createElement('option');
            option.value = urun;
            oneriAlani.appendChild(option);

            const item = document.createElement('div');
            item.className = 'stock-item';
            item.setAttribute('onclick', `formuDoldur('${urun.replace(/'/g, "\\'")}')`);

            let gorselIcerik = `<span>Görsel<br>Ekle</span>`;
            if (urunVerisi.gorsel) {
                gorselIcerik = `<img src="${urunVerisi.gorsel}" alt="${urun}">`;
            }

            item.innerHTML = `
                <div class="image-box" onclick="triggerGorselSec(event, '${urun.replace(/'/g, "\\'")}')">
                    ${gorselIcerik}
                </div>
                <div class="stock-details">
                    <span class="stock-name">${urun}</span>
                    <span class="stock-count">Mevcut: <span class="count-val">${adet} Adet</span></span>
                    <div class="stock-price-info">
                        <span class="price-badge">Geliş: ${paraFormati(gelis)}</span>
                        <span class="price-badge">Satış: ${paraFormati(satis)}</span>
                    </div>
                </div>
                <div class="quick-actions">
                    <button class="btn-quick sub" onclick="hizliGuncelle(event, '${urun.replace(/'/g, "\\'")}', false)">-</button>
                    <button class="btn-quick add" onclick="hizliGuncelle(event, '${urun.replace(/'/g, "\\'")}', true)">+</button>
                    <button class="btn-delete" title="Sil" onclick="urunSil(event, '${urun.replace(/'/g, "\\'")}')">🗑️</button>
                </div>
            `;
            listeAlani.appendChild(item);
        });
    }
</script>

</body>
</html>
